<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Shajarat Al-Durr Restaurant{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>

<body>
    <div class="page-loader" id="pageLoader">
        <div class="loader-ring"></div>
    </div>

    {% include 'navbar.html' %}

    <main>
        {% block content %}{% endblock %}
    </main>

    {% include 'footer.html' %}

    <a href="https://wa.me/2010xxxxxxxx" class="floating-action whatsapp" target="_blank" rel="noreferrer"
        aria-label="WhatsApp">
        <i class="bi bi-whatsapp"></i>
    </a>
    <a href="{% url 'reserve-table' %}" class="floating-action reservation" aria-label="Reserve Table">
        <i class="bi bi-calendar-check"></i>
    </a>
    <a href="{% url 'place-order' %}" class="floating-action order" aria-label="Order Now">
        <i class="bi bi-bag"></i>
    </a>
    <button id="backToTop" class="btn btn-gold rounded-circle position-fixed bottom-0 end-0 m-4 shadow" type="button"
        aria-label="Back to top">
        <i class="bi bi-arrow-up"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'js/script.js' %}"></script>
</body>

</html>
